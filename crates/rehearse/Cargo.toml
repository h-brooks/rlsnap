[package]
name = "rehearse"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
description = "Rehearse Postgres migrations inside an always-rolled-back transaction: per-statement timing, lock report, catalog diff, schema drift"
repository = "https://github.com/h-brooks/rlsnap"
keywords = ["postgres", "migrations", "supabase", "schema", "testing"]
categories = ["command-line-utilities", "database"]


[[bin]]
name = "rehearse"
path = "src/main.rs"

[dependencies]
pgcore = { path = "../pgcore", version = "0.1.0" }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
