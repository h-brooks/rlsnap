[package]
name = "rlsnap"
version = "0.2.1"
edition = { workspace = true }
license = { workspace = true }
description = "Snapshot testing for Postgres access control: probe every persona x table x column x operation, commit the snapshot, diff it in CI"
repository = "https://github.com/h-brooks/drydock"
keywords = ["postgres", "supabase", "rls", "row-level-security", "testing"]
categories = ["command-line-utilities", "database"]


[[bin]]
name = "rlsnap"
path = "src/main.rs"

[dependencies]
pgcore = { path = "../pgcore", version = "0.2.1" }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
