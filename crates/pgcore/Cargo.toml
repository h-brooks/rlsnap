[package]
name = "pgcore"
version = "0.2.0"
edition = { workspace = true }
license = { workspace = true }
description = "Shared Postgres core for rlsnap and rehearse: env-only targets, always-ROLLBACK transactions, persona impersonation, SQLSTATE classification, catalog snapshots"
repository = "https://github.com/h-brooks/rlsnap"
keywords = ["postgres", "supabase", "rls", "security", "testing"]
categories = ["command-line-utilities", "database"]


[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
